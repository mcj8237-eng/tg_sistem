<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tudo Gostoso – Lanches Gourmet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#FFC700;--ink:#3B1F14;--card:#FFF3C4;--red:#C8281E;--red-ink:#fff;--muted:#6b3f2c;--line:#3B1F14;--choc:#3a1c10;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#2a160d;--ink:#FFE9B0;--card:#3d2216;--red:#FF5A4A;--red-ink:#2a160d;--muted:#e0b98f;--line:#FFE9B0;--choc:#5b3220;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;position:relative;background:var(--bg);color:var(--ink);font:17px/1.5 'Nunito',system-ui,sans-serif;padding-bottom:110px;overflow-x:hidden}
h1,h2,h3{font-family:'Bagel Fat One','Arial Black',sans-serif;font-weight:400;margin:0;line-height:1.05}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
#drips{position:absolute;top:0;left:0;right:0;height:0;pointer-events:none;z-index:1}
#drips:before{content:"";position:absolute;top:0;left:0;right:0;height:28px;background:var(--choc)}
.drip{position:absolute;top:0;height:var(--h);background:linear-gradient(90deg,var(--choc),#6a3722 45%,var(--choc));border-radius:0 0 999px 999px;animation:drip 1.5s cubic-bezier(.3,1.35,.5,1) both}
@keyframes drip{from{height:0}}
.hero{padding:150px 0 36px;position:relative;z-index:2}
.sub{font-weight:800;margin:0 0 6px;animation:up .6s 1s both}
.hero h1{font-size:clamp(64px,17vw,150px);color:var(--red);text-shadow:4px 4px 0 var(--ink);letter-spacing:-1px}
.hero h1 span{display:block;animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.hero h1 span:nth-child(1){animation-delay:.9s}.hero h1 span:nth-child(2){animation-delay:1.1s}
@keyframes up{from{opacity:0;transform:translateY(50px) rotate(2deg)}to{opacity:1;transform:none}}
.hero p{max-width:34ch;font-size:19px;font-weight:600;margin:20px 0 24px;animation:up .7s 1.35s both}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;animation:up .7s 1.5s both}
.btn{display:inline-block;background:var(--ink);color:var(--bg);font:800 17px 'Nunito',sans-serif;padding:13px 24px;border:3px solid var(--line);border-radius:999px;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.red{background:var(--red);color:var(--red-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:9px 18px;font-size:16px}
:is(.btn,.tabs button,.qty button,input):focus-visible{outline:3px solid var(--red);outline-offset:3px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:10px;overflow-x:auto;padding:12px 20px;margin:0 -20px;border-bottom:3px solid var(--line)}
.tabs button{flex:none;font:800 16px 'Nunito',sans-serif;color:var(--ink);background:transparent;border:3px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;padding:26px 0}
.item{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:6px 6px 0 var(--line)}
.item h3{font-size:23px;color:var(--red)}
.item p{margin:0;color:var(--muted);font-size:15px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.price{font-weight:800;font-size:19px}
.contact{padding:26px 0 10px;border-top:3px solid var(--line);font-weight:600}
.contact a{color:var(--ink);font-weight:800}
footer{padding:6px 0 30px;font-size:14px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:10}
.bar.show{transform:none}
.bar .in{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px}
.bar b{font-size:19px}
.bar .btn{background:var(--red);color:var(--red-ink);border-color:var(--red)}
dialog{border:3px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);padding:0;width:min(520px,94vw);max-height:88vh;box-shadow:8px 8px 0 var(--line)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(30,10,0,.6)}
.dh{padding:18px 20px 4px}.dh h3{font-size:26px;color:var(--red)}.dh p{margin:4px 0 0;color:var(--muted);font-size:15px}
.db{padding:6px 20px;overflow:auto}
.df{padding:14px 20px;border-top:3px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
fieldset{border:0;padding:0;margin:12px 0}
legend{font-weight:800;padding:0}legend small{font-weight:600;color:var(--muted)}
label.o{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
label.o input{width:22px;height:22px;accent-color:var(--red);flex:none}
label.o b{margin-left:auto}
.line{padding:10px 0;border-bottom:2px dashed var(--line)}
.line .top{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.line small{display:block;color:var(--muted)}
.qty{display:flex;align-items:center;gap:10px;margin-top:6px}
.qty button{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);background:var(--red);color:var(--red-ink);font:800 20px 'Nunito',sans-serif;cursor:pointer;line-height:1}
.qty button.m{background:transparent;color:var(--ink)}
.qty output{min-width:20px;text-align:center;font-weight:800}
.fld{display:block;width:100%;margin-top:10px;padding:11px 14px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:600 16px 'Nunito',sans-serif}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin-top:12px}
.banner{background:var(--red);color:var(--red-ink);font-weight:800;border:3px solid var(--line);border-radius:18px;padding:14px 18px;margin:20px 0 0;box-shadow:6px 6px 0 var(--line)}
.adm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:20}
.item.off{opacity:.55}
.bar .acts2{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.bar .btn.ghost{background:transparent;color:var(--bg);border-color:var(--bg)}
#admin h4{margin:18px 0 6px;font:400 20px 'Bagel Fat One',sans-serif;color:var(--red)}
.arow{display:grid;grid-template-columns:1fr 92px;gap:6px;padding:8px 0;border-bottom:2px dashed var(--line)}
.arow .fld{margin:0;padding:8px 10px;font-size:15px}
.arow .full,.arow label{grid-column:1/-1}
.arow label{display:flex;gap:8px;align-items:center;font-weight:700}
.arow label input{width:20px;height:20px;accent-color:var(--red)}
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;animation:up .7s 1.6s both}
.av{position:relative;flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--red);color:var(--red-ink);display:grid;place-items:center;font:400 22px 'Bagel Fat One',sans-serif}
.av:before{content:attr(data-i)}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.av i{position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:#2ecc71;border:3px solid var(--line)}
.who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.who b{font-size:17px}.who small{font-weight:600;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.logo{position:absolute;right:0;top:80px;width:clamp(104px,28vw,210px);z-index:3;rotate:-4deg;animation:up .8s 1.2s both}
.ban{display:flex;gap:12px;justify-content:center;padding-top:22px}
.ban:empty{display:none}
.ban img{flex:1 1 0;min-width:0;max-width:100%;height:clamp(130px,32vw,230px);object-fit:contain}
.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;margin-bottom:4px;background:var(--bg)}
.art{display:grid;place-items:center}.art svg{width:86%;height:auto}.art .k{stroke:var(--line)}
.themebtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:20;background:var(--card);color:var(--ink)}
.code{font:400 36px 'Bagel Fat One',sans-serif;letter-spacing:3px;text-align:center;padding:14px;border:3px dashed var(--line);border-radius:16px;margin:12px 0;color:var(--red)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

  if(t==="strand")top=P.map(([x,y])=>`<path d="M${x-8} ${y}q8-8 16 0" stroke="${d}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`).join("");
  else if(t==="dots")top=P.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="${d}"/>`).join("");
  else if(t==="banana")top=P.slice(0,4).map(([x,y])=>`<ellipse class="k" cx="${x}" cy="${y}" rx="9" ry="7" fill="${d}" stroke-width="2"/>`).join("");
  else top=P.slice(0,3).map(([x,y])=>`<circle class="k" cx="${x}" cy="${y}" r="8" fill="${d}" stroke-width="2"/>`).join("");
  return `<svg viewBox="0 0 240 160" aria-hidden="true"><ellipse cx="120" cy="140" rx="108" ry="14" fill="#000" opacity=".14"/><ellipse class="k" cx="120" cy="122" rx="104" ry="26" fill="#fff8ec" stroke-width="3"/><path class="k" d="M26 116C42 46 198 46 214 116C168 142 72 142 26 116Z" fill="#e8a94a" stroke-width="3"/><g fill="#c98a2f" opacity=".55"><circle cx="70" cy="92" r="3"/><circle cx="96" cy="74" r="3"/><circle cx="62" cy="110" r="3"/><circle cx="108" cy="92" r="3"/><circle cx="84" cy="112" r="3"/></g><path class="k" d="M120 60C152 66 192 88 212 114C188 128 150 124 120 112Z" fill="${f}" stroke-width="3"/>${top}</svg>`;
}
const $=s=>document.querySelector(s);
const cart=[]; let cat=0;
const tabs=$("#cardapio"), grid=$("#grid"), pick=$("#pick"), cartd=$("#cartd");

// animação: chocolate escorrendo
const H=[70,120,45,95,140,55,105,80,130,50,100,125,60,90,115,75];
H.forEach((h,i)=>{const d=document.createElement("div");d.className="drip";
  d.style.cssText=`left:${i*6.25-1}%;width:8.6%;--h:${h}px;animation-delay:${(i*70+(i%3)*130)}ms`;$("#drips").appendChild(d)});

function renderTabs(){
  tabs.innerHTML="";
  MENU.forEach((m,i)=>{const b=document.createElement("button");b.textContent=m.c;b.setAttribute("role","tab");
    b.setAttribute("aria-selected",i===cat);b.onclick=()=>{cat=i;renderTabs();renderGrid()};tabs.appendChild(b)});
}
const keyOf=(c,it)=>c+"|"+it.n;
function effItems(c,S=STATE){
  return MENU[c].items.map(it=>({...it,...(S.ov[keyOf(c,it)]||{}),key:keyOf(c,it)}))
    .concat(S.x.filter(x=>x.c===c).map(x=>({...x,key:"x"+x.id,ext:1})));
}
function renderBanner(){const b=$("#banner");b.hidden=STATE.open;b.textContent=STATE.open?"":"Estamos fechados no momento. "+(STATE.msg||"Volte em breve!")}
function renderGrid(){
  grid.innerHTML="";$("#ban").innerHTML=(BAN[cat]||[]).map(k=>`<img src="${IMG[k]}" alt="">`).join("");
  effItems(cat).forEach(it=>{
    const el=document.createElement("article");el.className="item"+(it.off?" off":"");
    el.innerHTML=(CR[it.key]?`<div class="ph art">${crepeSVG(...CR[it.key])}</div>`:IM[it.key]?`<img class="ph" src="${IMG[IM[it.key]]}" alt="${esc(it.n)}" loading="lazy">`:"")+`<h3>${esc(it.n)}</h3><p>${esc(it.d||"")}</p><div class="row"><span class="price">${it.f?"a partir de ":""}${money(it.f||it.p)}</span><button class="btn red sm"${it.off||!STATE.open?" disabled":""}>${it.off?"Indisponível":it.g?"Escolher":"Adicionar"}</button></div>`;
    el.querySelector("button").onclick=()=>it.g?openPick(it):addLine(it,[],it.p);
    grid.appendChild(el);
  });
}
function addLine(it,opts,price){
  if(!STATE.open)return;
  const o=opts.map(x=>`${x.t}: ${x.v.join(", ")}`).join(" | ");
  const key=it.n+"|"+o, ex=cart.find(l=>l.key===key);
  if(ex)ex.q++;else cart.push({key,n:it.n,o,p:price,q:1});
  updateBar();
}
function openPick(it){
  const hint=r=>r.min===0?`opcional, até ${r.max}`:`escolha ${r.max}`;
  pick.innerHTML=`<div class="dh"><h3>${it.n}</h3><p>${it.d||""}</p></div><div class="db">`+
    it.g.map((r,gi)=>`<fieldset><legend>${r.t} <small>(${hint(r)})</small></legend>`+
      r.o.map((o,oi)=>`<label class="o"><input type="${r.max===1?"radio":"checkbox"}" name="g${gi}" value="${oi}"><span>${o[0]}</span>${o[1]?`<b>${it.p===0?money(o[1]):"+ "+money(o[1])}</b>`:""}</label>`).join("")+`</fieldset>`).join("")+
    `</div><div class="df"><button class="btn ghost sm" id="no">Cancelar</button><button class="btn red sm" id="ok">Adicionar</button></div>`;
  const ok=pick.querySelector("#ok");
  const read=()=>it.g.map((r,gi)=>[...pick.querySelectorAll(`input[name=g${gi}]:checked`)].map(i=>+i.value));
  const sync=()=>{
    const sel=read();let valid=true,price=it.p;
    it.g.forEach((r,gi)=>{const c=sel[gi].length;if(c<r.min||c>r.max)valid=false;sel[gi].forEach(oi=>price+=r.o[oi][1]);
      if(r.max>1)pick.querySelectorAll(`input[name=g${gi}]`).forEach(i=>{i.disabled=!i.checked&&c>=r.max})});
    ok.disabled=!valid;ok.textContent="Adicionar · "+money(price);ok.dataset.price=price;
  };
  pick.onchange=sync;sync();
  pick.querySelector("#no").onclick=()=>pick.close();
  ok.onclick=()=>{const sel=read();
    const opts=it.g.map((r,gi)=>({t:r.t,v:sel[gi].map(oi=>r.o[oi][0])})).filter(x=>x.v.length);
    addLine(it,opts,+ok.dataset.price);pick.close()};
  pick.showModal();
}
function totals(){let n=0,t=0;cart.forEach(l=>{n+=l.q;t+=l.q*l.p});return [n,t]}
function orderLink(){
  const [,t]=totals();
  const msg=`Olá, ${LOJA}! Quero fazer um pedido:\n\n`+cart.map(l=>`${l.q}x ${l.n}${l.o?" ("+l.o+")":""} – ${money(l.q*l.p)}`).join("\n")+`\n\nTotal: ${money(t)}`+(CUST.nm?`\nNome: ${CUST.nm}`:"")+(CUST.ad?`\nEndereço: ${CUST.ad}`:"");
  return "https://wa.me/"+STATE.wa+"?text="+encodeURIComponent(msg);
}
function updateBar(){
  const [n,t]=totals();$("#count").textContent=n;$("#total").textContent=money(t);
  $("#bar").classList.toggle("show",n>0&&STATE.open);$("#barSend").href=orderLink();
  if(cartd.open)renderCart();
}
function renderCart(){
  const [n,t]=totals();
  if(!n){cartd.close();return}
  cartd.innerHTML=`<div class="dh"><h3>Seu carrinho</h3></div><div class="db">`+
    cart.map((l,i)=>`<div class="line"><div class="top"><span>${esc(l.n)}</span><span>${money(l.q*l.p)}</span></div>${l.o?`<small>${esc(l.o)}</small>`:""}
    <div class="qty"><button class="m" data-i="${i}" data-d="-1" aria-label="Tirar ${esc(l.n)}">−</button><output>${l.q}</output><button data-i="${i}" data-d="1" aria-label="Adicionar ${esc(l.n)}">+</button></div></div>`).join("")+
    `<input class="fld" id="nm" placeholder="Seu nome" value="${esc(CUST.nm)}"><input class="fld" id="ad" placeholder="Endereço ou “retirada no local”" value="${esc(CUST.ad)}">
    <div class="tot"><span>Total</span><span>${money(t)}</span></div></div>
    <div class="df"><button class="btn ghost sm" id="close">Continuar comprando</button><a class="btn red sm" id="send" target="_blank" rel="noopener" href="${orderLink()}">Enviar pedido no WhatsApp</a></div>`;
  cartd.querySelectorAll("#nm,#ad").forEach(i=>i.oninput=()=>{CUST.nm=cartd.querySelector("#nm").value;CUST.ad=cartd.querySelector("#ad").value;const h=orderLink();cartd.querySelector("#send").href=h;$("#barSend").href=h});
  cartd.querySelector("#close").onclick=()=>cartd.close();
  cartd.querySelectorAll(".qty button").forEach(b=>b.onclick=()=>{const l=cart[+b.dataset.i];l.q+=+b.dataset.d;if(l.q<=0)cart.splice(+b.dataset.i,1);updateBar()});
}
$("#seeCart").onclick=()=>{renderCart();if(cart.length)cartd.showModal()};
[pick,cartd].forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));
renderTabs();renderGrid();renderBanner();updateBar();

// ===== CONTA GOOGLE DO CLIENTE (via Firebase) =====
let USER=null;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
window.FBOK=false;
function renderAcct(){
  const a=$("#acct");
  if(!window.FBOK){a.style.display="none";return}
  a.style.display="";
  if(!USER){a.innerHTML='<button class="btn sm" id="gin">Entrar com Google</button>';a.querySelector("#gin").onclick=()=>window.fbIn();return}
  const last=store.get("tg_last_"+USER.sub);
  if(!CUST.nm)CUST.nm=USER.name;
  if(!CUST.ad&&last&&last.ad)CUST.ad=last.ad;
  updateBar();
  a.innerHTML='<span class="av"><img alt="" referrerpolicy="no-referrer"><i></i></span><div class="who"><b></b><small></small></div>'+(isAdm()?'<button class="btn sm" id="own">🔑 '+(PAIR?fmt(PAIR):"Painel")+'</button>':"")+(last?'<button class="btn sm" id="again">Repetir último pedido</button>':"")+'<button class="btn ghost sm" id="out">Sair</button>';
  a.querySelector(".av").dataset.i=(USER.name||"?").trim()[0].toUpperCase();
  const img=a.querySelector("img");if(/^https:\/\//.test(USER.pic)){img.src=USER.pic;img.onerror=()=>img.remove()}else img.remove();
  a.querySelector("b").textContent="Olá, "+USER.name.split(" ")[0]+"!";
  a.querySelector("small").textContent=USER.email||"";
  a.querySelector("#out").onclick=()=>window.fbOut();
  const ow=a.querySelector("#own");if(ow)ow.onclick=openOwner;
  const ag=a.querySelector("#again");
  if(ag)ag.onclick=()=>{if(!STATE.open)return;cart.length=0;last.cart.forEach(l=>cart.push(l));updateBar();renderCart();cartd.showModal()};
}
// --- dono: código de conexão que muda toda vez que o site é aberto ---
const OWNER="COLE_SEU_EMAIL@gmail.com";window.OWNER=OWNER;
window.defaultCfg=()=>({open:true,msg:"",wa:STATE.wa,ov:{},x:[],admins:[]});
let PAIR="",genning=false;
const fmt=c=>c?c.slice(0,4)+"-"+c.slice(4):"…";
function isAdm(){const e=(USER&&USER.email||"").toLowerCase();return !!e&&(e===OWNER.toLowerCase()||(STATE.admins||[]).map(x=>String(x).toLowerCase()).includes(e))}
async function maybeGen(force){
  if(genning||(PAIR&&!force)||!window.fbNewCode||!USER||!isAdm())return;
  genning=true;try{PAIR=await window.fbNewCode()}catch(e){console.warn(e)}
  genning=false;renderAcct();
}
function openOwner(){
  const D=$("#owner");
  D.innerHTML=`<div class="dh"><h3>Painel do dono</h3><p>Abra o painel e digite este código para conectar. Ele muda toda vez que você abre o site e vale por 6 horas.</p></div><div class="db"><div class="code" id="pc">${fmt(PAIR)}</div>
    <button class="btn sm" id="newc">Gerar novo código</button>
    <fieldset><legend>Admins <small>(podem ver o código)</small></legend><div id="al"></div>
    <input class="fld" id="ae" type="email" placeholder="E-mail do novo admin (Google)"><button class="btn sm" id="aa" style="margin-top:10px">Adicionar</button></fieldset></div>
    <div class="df"><button class="btn ghost sm" id="oc">Fechar</button></div>`;
  const drawA=()=>{D.querySelector("#al").innerHTML=(STATE.admins||[]).map((e,i)=>`<div class="row"><span>${esc(e)}</span><button class="btn ghost sm" data-rm="${i}">Remover</button></div>`).join("")||"<small>Nenhum admin extra.</small>"};
  drawA();
  D.onclick=async e=>{const t=e.target.closest("button");if(!t)return;
    try{
      if(t.id==="oc")D.close();
      else if(t.id==="newc"){PAIR="";await maybeGen(true);D.querySelector("#pc").textContent=fmt(PAIR)}
      else if(t.id==="aa"){const v=D.querySelector("#ae").value.trim().toLowerCase();
        if(v.includes("@")&&!(STATE.admins||[]).includes(v)){const l=[...(STATE.admins||[]),v];await window.fbAdmins(l);STATE.admins=l;D.querySelector("#ae").value="";drawA()}}
      else if(t.dataset.rm){const l=[...(STATE.admins||[])];l.splice(+t.dataset.rm,1);await window.fbAdmins(l);STATE.admins=l;drawA()}
    }catch(x){alert("Sem permissão ou sem conexão.")}};
  D.showModal();
}
window.onUser=u=>{USER=u?{sub:u.uid,name:u.displayName||"Cliente",email:u.email||"",pic:u.photoURL||""}:null;if(!u)PAIR="";renderAcct();maybeGen()};
window.onConfig=c=>{STATE={...STATE,open:c.open!==false,msg:c.msg||"",wa:c.wa||STATE.wa,ov:c.ov||{},x:c.x||[],admins:c.admins||[]};renderBanner();renderGrid();updateBar();renderAcct();maybeGen()};
function saveOrder(){if(USER&&cart.length)store.set("tg_last_"+USER.sub,{cart:JSON.parse(JSON.stringify(cart)),ad:CUST.ad})}
document.addEventListener("click",e=>{if(e.target.closest("#send,#barSend")){saveOrder();setTimeout(renderAcct,0)}});
renderAcct();

// ===== ADMIN (só editores do artefato) =====
function setF(k,f,v){
  if(f==="p")v=parseFloat(String(v).replace(",","."))||0;
  if(k[0]==="x"){const x=W.x.find(x=>"x"+x.id===k);if(x)x[f]=v}
  else(W.ov[k]=W.ov[k]||{})[f]=v;
}
function drawAdmin(){
  $("#adb").innerHTML=`<button class="btn ${W.open?"red":""}" id="tg">${W.open?"Loja ABERTA · toque para fechar":"Loja FECHADA · toque para abrir"}</button>
  <input class="fld" id="msg" placeholder="Aviso quando fechada (ex.: Abrimos às 18h)" value="${esc(W.msg)}">
  <input class="fld" id="wa" inputmode="numeric" placeholder="WhatsApp: 55 + DDD + número" value="${esc(W.wa)}">`+
  MENU.map((m,c)=>`<h4>${m.c}</h4>`+effItems(c,W).map(it=>`<div class="arow">
    <input class="fld" data-k="${it.key}" data-f="n" value="${esc(it.n)}" aria-label="Nome">
    <input class="fld" data-k="${it.key}" data-f="p" inputmode="decimal" value="${it.f?"":it.p}" ${it.f?'disabled placeholder="por tamanho"':""} aria-label="Preço">
    <input class="fld full" data-k="${it.key}" data-f="d" value="${esc(it.d||"")}" placeholder="Descrição" aria-label="Descrição">
    <label><input type="checkbox" data-k="${it.key}" data-f="off" ${it.off?"":"checked"}> Disponível</label>${it.ext?`<button class="btn ghost sm" data-del="${it.key}">Apagar item</button>`:""}</div>`).join("")+
    `<button class="btn ghost sm" data-add="${c}" style="margin-top:8px">+ Novo item em ${m.c}</button>`).join("");
}
function openAdmin(){
  W=JSON.parse(JSON.stringify(STATE));const D=$("#admin");
  D.innerHTML='<div class="dh"><h3>Painel do admin</h3></div><div class="db" id="adb"></div><div class="df"><span id="adm-msg" style="flex:1;font-size:14px"></span><button class="btn ghost sm" id="adx">Fechar</button><button class="btn red sm" id="ads">Salvar e publicar</button></div>';
  const adb=$("#adb");
  adb.oninput=e=>{const t=e.target;
    if(t.id==="msg")W.msg=t.value;else if(t.id==="wa")W.wa=t.value.replace(/\D/g,"");
    else if(t.dataset.k)setF(t.dataset.k,t.dataset.f,t.type==="checkbox"?!t.checked:t.value)};
  adb.onclick=e=>{const t=e.target.closest("button");if(!t)return;
    if(t.id==="tg")W.open=!W.open;
    else if(t.dataset.add)W.x.push({id:Date.now().toString(36),c:+t.dataset.add,n:"Novo item",d:"",p:0});
    else if(t.dataset.del)W.x=W.x.filter(x=>"x"+x.id!==t.dataset.del);
    else return;
    drawAdmin()};
  $("#adx").onclick=()=>D.close();$("#ads").onclick=saveState;
  drawAdmin();D.showModal();
}
function cleanHtml(){
  const d=document.documentElement.cloneNode(true),keep=["drips","admBtn","bar","pick","cartd","admin","state","app"];
  [...d.querySelector("body").children].forEach(n=>{if(!(n.classList.contains("wrap")||keep.includes(n.id)))n.remove()});
  ["drips","grid","ban","cardapio","pick","cartd","admin","banner"].forEach(id=>{const e=d.querySelector("#"+id);e.innerHTML="";e.removeAttribute("open")});
  d.querySelector("#banner").setAttribute("hidden","");d.removeAttribute("data-theme");d.querySelector("#admBtn").setAttribute("hidden","");
  d.querySelector("#bar").classList.remove("show");d.querySelector("#count").textContent="0";d.querySelector("#total").textContent="R$ 0,00";d.querySelector("#barSend").setAttribute("href","#");
  let sty=0;[...d.querySelector("head").children].forEach(n=>{const t=n.tagName;
    const ok=t==="TITLE"||(t==="META"&&(n.hasAttribute("charset")||n.getAttribute("name")==="viewport"))||(t==="LINK"&&/fonts/.test(n.getAttribute("href")||""))||(t==="STYLE"&&sty++===0);
    if(!ok)n.remove()});
  d.querySelector("#state").textContent=JSON.stringify(W).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n"+d.outerHTML;
}
async function saveState(){
  const btn=$("#ads"),m=$("#adm-msg");btn.disabled=true;btn.textContent="Publicando…";m.textContent="";
  try{await ADM.publish(cleanHtml())}
  catch(e){btn.disabled=false;btn.textContent="Salvar e publicar";
    m.textContent=e&&e.code==="conflict"?"A página acabou de ser atualizada. Recarregando…":"Não foi possível salvar. Só editores podem publicar."}
}
(async()=>{
  try{
    if(!(window.claude&&claude.use))return;
    const [u,a]=await Promise.all([claude.use("user"),claude.use("artifact")]);
    if(!u||!a)return;
    if((await u.canEdit())||(await u.isOwner())){ADM=a;$("#admBtn").hidden=false;$("#admBtn").onclick=openAdmin}
  }catch(e){}
})();
(function(){
  const R=document.documentElement;let t="light";
  try{t=localStorage.getItem("tg_theme")||"light"}catch(e){}
  const set=v=>{t=v;R.dataset.theme=v;$("#themeBtn").textContent=v==="dark"?"☀ Modo claro":"🌙 Modo escuro";try{localStorage.setItem("tg_theme",v)}catch(e){}};
  $("#themeBtn").onclick=()=>set(t==="dark"?"light":"dark");set(t);
})();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,onSnapshot,setDoc,deleteDoc,collection,getDocs,query,where,Timestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// COLE AQUI o firebaseConfig do seu projeto (Firebase › Configurações do projeto › Seus apps)
const firebaseConfig={apiKey:"COLE_AQUI",authDomain:"COLE_AQUI",projectId:"COLE_AQUI",appId:"COLE_AQUI"};
if(!firebaseConfig.apiKey.startsWith("COLE")){
  const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
  window.FBOK=true;
  window.fbIn=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert("Não foi possível entrar ("+e.code+")"));
  window.fbOut=()=>signOut(auth);
  const ref=doc(db,"loja","config");let noCfg=false;
  const isOwner=()=>auth.currentUser&&(auth.currentUser.email||"").toLowerCase()===window.OWNER.toLowerCase();
  const tryInit=()=>{if(noCfg&&isOwner()){noCfg=false;setDoc(ref,window.defaultCfg()).catch(e=>console.warn(e))}};
  window.fbAdmins=list=>setDoc(ref,{admins:list},{merge:true});
  window.fbNewCode=async()=>{
    const email=auth.currentUser.email.toLowerCase();
    const old=await getDocs(query(collection(db,"pairs"),where("by","==",email)));
    await Promise.all(old.docs.map(d=>deleteDoc(d.ref)));
    const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",b=crypto.getRandomValues(new Uint8Array(8));
    const code=[...b].map(x=>A[x%A.length]).join("");
    await setDoc(doc(db,"pairs",code),{by:email,exp:Timestamp.fromMillis(Date.now()+6*3600*1000)});
    return code;
  };
  onAuthStateChanged(auth,u=>{window.onUser(u);tryInit()});
  onSnapshot(ref,s=>{if(s.exists())window.onConfig(s.data());else{noCfg=true;tryInit()}},e=>console.warn(e));
}
</script>
